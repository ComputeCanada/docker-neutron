name: ci

# Mirror of the GitLab pipeline in .gitlab-ci.yml, publishing to ghcr.io
# instead of the internal registry, so the image can be pulled without an
# imagePullSecret (same reasoning as docker-openvswitch).
on:
  workflow_dispatch:
  push:
    branches:
      - '**'
    tags:
      - 'v*'
  release:
    types:
      - published

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    # One native runner per architecture, so the smoke test runs real arm64
    # binaries rather than qemu-emulated ones.
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@b09bb98e06d4d774595224525879c09bc6e98c40 # v2.20.1
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - uses: step-security/docker-login-action@bd6978fd4ef9a5f78130095b298b8a721afcb0d8 # v4.5.1
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # ghcr.io rejects a mixed-case path, and the org is spelled ComputeCanada.
      - name: Resolve the image name
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        id: meta
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=sha,format=short
            type=raw,value=${{ github.event.release.tag_name }},enable=${{ github.event_name == 'release' }}
            type=raw,value=latest,enable=${{ github.event_name == 'release' }}

      # Loaded rather than pushed: nothing reaches a registry before
      # ci/smoke-test.sh has run against it.
      - name: Build the ${{ matrix.arch }} image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          platforms: linux/${{ matrix.arch }}
          load: true
          tags: neutron:ci-${{ matrix.arch }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Smoke test the ${{ matrix.arch }} image
        env:
          CONTAINER_RUNTIME: docker
        run: ./ci/smoke-test.sh --platform linux/${{ matrix.arch }} neutron:ci-${{ matrix.arch }}

      # The staging tag only gets the image into the registry for the manifest
      # job; the digest is read from this push so a concurrent run cannot swap it.
      - name: Push the ${{ matrix.arch }} image
        run: |
          set -euo pipefail
          staging="${IMAGE}:staging-${{ matrix.arch }}"
          docker tag "neutron:ci-${{ matrix.arch }}" "$staging"
          docker push "$staging" | tee /tmp/push.log
          digest="$(sed -n 's/.*digest: \(sha256:[0-9a-f]\{64\}\).*/\1/p' /tmp/push.log | tail -1)"
          [ -n "$digest" ] || { echo "no digest in the push output" >&2; exit 1; }
          mkdir -p /tmp/digests
          echo "$digest" > "/tmp/digests/${{ matrix.arch }}"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: digest-${{ matrix.arch }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  # needs: build means a smoke-test failure on either arch leaves the published
  # tags untouched.
  manifest:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@b09bb98e06d4d774595224525879c09bc6e98c40 # v2.20.1
        with:
          egress-policy: audit

      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - uses: step-security/docker-login-action@bd6978fd4ef9a5f78130095b298b8a721afcb0d8 # v4.5.1
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve the image name
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: /tmp/digests
          pattern: digest-*
          merge-multiple: true

      - uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        id: meta
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=sha,format=short
            type=raw,value=${{ github.event.release.tag_name }},enable=${{ github.event_name == 'release' }}
            type=raw,value=latest,enable=${{ github.event_name == 'release' }}

      - name: Create the manifest list
        run: |
          set -euo pipefail
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(for f in /tmp/digests/*; do printf '%s@%s ' "$IMAGE" "$(cat "$f")"; done)

      - name: Inspect the published manifest list
        run: docker buildx imagetools inspect "${IMAGE}:${{ steps.meta.outputs.version }}"
